name = "regula_website"
defaultTargets = ["regula-site"]
# Share the root package's dependency checkouts (Mathlib and its artifacts) instead of a
# second copy; the shared entries of both lock manifests must be equal.
packagesDir = "../.lake/packages"

# Pinned Verso; the exact transitive revisions are locked in lake-manifest.json.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "cad4b633e75ea769b851f12f9ca3b4f0dfcc625f"

# The root package: the standard's examples import its modules and Mathlib.
[[require]]
name = "regula"
path = ".."

# Site-owned Verso extensions and styles.
[[lean_lib]]
name = "RegulaSite"

# Generated by `lake exe site build` in the repository root; never edited by hand.
[[lean_lib]]
name = "Generated"
globs = ["Generated", "Generated.+"]

[[lean_exe]]
name = "regula-site"
root = "Main"

# The standard's checked-example code blocks.
[[lean_lib]]
name = "RegulaExample"

# The standard: Verso source of truth, published on the site.
[[lean_lib]]
name = "RegulaStandard"
globs = ["RegulaStandard", "RegulaStandard.+"]
# Examples run the helper and import the root package's modules at elaboration time.
needs = ["regula-example", "@regula/Audit", "@regula/AuditApp"]

# Elaborates one example module in a fresh process for the standard's `lean` blocks.
[[lean_exe]]
name = "regula-example"
root = "RegulaExampleMain"
supportInterpreter = true

# Renders the standard alone: its cross-references resolve or the run fails.
[[lean_exe]]
name = "regula-standard"
root = "StandardMain"
