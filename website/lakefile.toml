name = "regula_website"
defaultTargets = ["regula-site"]
# Share the root `.lake/packages`, where the Mathlib package in `../audit` keeps its dependency
# checkouts (Mathlib and its artifacts), instead of a second copy; the shared entries of both
# lock manifests must be equal.
packagesDir = "../.lake/packages"

# Pinned Verso; the exact transitive revisions are locked in lake-manifest.json.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "cad4b633e75ea769b851f12f9ca3b4f0dfcc625f"

# The root package: the standard's examples import its modules (such as `AuditApp`).
[[require]]
name = "regula"
path = ".."

# The Mathlib-dependent package: the standard's examples import its `Audit` modules and Mathlib.
[[require]]
name = "regula_audit"
path = "../audit"

# Site-owned Verso extensions and styles.
[[lean_lib]]
name = "RegulaSite"

# Generated by `lake exe site build` in the repository root; never edited by hand.
[[lean_lib]]
name = "Generated"
globs = ["Generated", "Generated.+"]

[[lean_exe]]
name = "regula-site"
root = "Main"

# The standard's checked-example code blocks.
[[lean_lib]]
name = "RegulaExample"

# The standard: Verso source of truth, published on the site.
[[lean_lib]]
name = "RegulaStandard"
globs = ["RegulaStandard", "RegulaStandard.+"]
# Examples run the helper and import these libraries' modules at elaboration time.
needs = ["regula-example", "@regula_audit/Audit", "@regula/AuditApp"]

# Elaborates one example module in a fresh process for the standard's `lean` blocks.
[[lean_exe]]
name = "regula-example"
root = "RegulaExampleMain"
supportInterpreter = true

# md4c's reading of a Markdown document (MD4Lean, which the pinned Verso requires), for the
# rule-ID check of the repository's tracked Markdown documents.
[[lean_lib]]
name = "RegulaMarkdown"

# Checks every tracked Markdown document; the documentation step of acceptance runs it.
[[lean_exe]]
name = "regula-markdown"
root = "MarkdownMain"

# Renders the standard alone: its cross-references resolve or the run fails.
[[lean_exe]]
name = "regula-standard"
root = "StandardMain"
