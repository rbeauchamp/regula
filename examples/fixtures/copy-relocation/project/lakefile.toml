# The project of the `qualify copy-relocation` control. It requires the package `dep` by local
# path. Its lake-manifest.json has two entries for `dep`: the first names the configuration file
# `a.toml`, and the last, from which Lake materializes `dep`, names `b.toml`.
name = "project"

[[require]]
name = "dep"
path = "../dep"

[[lean_lib]]
name = "Project"
