# A project of the `qualify copy-relocation` control that requires the package `odep` by path, in its
# own directory. The manifest entry for `odep` names the manifest `pins.olean`, which the control
# places there from `../placed/pins.json`. A copy leaves out each file with a compiled-module name, so
# it must refuse that manifest by name.
name = "olean_manifest"

[[require]]
name = "odep"
path = "odep"

[[lean_lib]]
name = "OleanManifest"
