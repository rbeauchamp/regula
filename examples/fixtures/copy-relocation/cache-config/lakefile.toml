# A project of the `qualify copy-relocation` control that requires the package `cdep` by path, in its
# own directory. The manifest entry for `cdep` names the configuration `.cache/package.toml`, which the
# control places there from `../placed`, and then as a link to `../package.toml`. A copy leaves out
# each directory named `.cache`, so it must refuse that configuration file by name in both cases.
name = "cache_config"

[[require]]
name = "cdep"
path = "cdep"

[[lean_lib]]
name = "CacheConfig"
