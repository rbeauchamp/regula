name = "lake_lint_adopter"
defaultTargets = ["Gadget"]
# `lake lint` runs the Regula driver over every manifested surface.
lintDriver = "regula/lint"
# The community linters of standard §6.7 and the options of §7.1. A library that imports
# Mathlib also enables Mathlib's standard set, as the adoption guide shows.
[leanOptions]
linter.missingDocs = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "regula"
path = "../.."

[[lean_lib]]
name = "Gadget"
# Regula's elaboration observer records the options the source sets and the messages a build does
# not show (RG2003, RG2006); every claimed target loads it, and lists it in `needs` (RG2006) so
# that a fresh build builds it once and a replayed module was elaborated with it.
plugins = ["@regula/RegulaObserver:shared"]
needs = ["@regula/RegulaObserver:shared"]
globs = ["Gadget", "Gadget.+"]
