name = "regula_specification"
defaultTargets = ["RegulaSpecification"]

# Regula's checker runs on this package too (`lake lint`), so that each theorem here depends on no axiom
# beyond the three of the profile.
lintDriver = "regula/lint"
lintDriverArgs = ["standard-logical"]

# The specification of Regula (`README.md` in this directory): each rule's formal statement, written as
# an intent record of lean-intent, and the proofs of the functions that the checker runs against those
# statements. Nothing of the root package imports it. `lake build` here checks every statement and every
# theorem.

# lean-intent, at commit 30fe70d on its `main`, after its umbrella modules were removed. The
# specification imports three of its modules: `LeanIntent.Record`, `LeanIntent.Obligations` and
# `LeanIntent.Progress`. It requires no package.
[[require]]
name = "lean-intent"
git = "https://github.com/rbeauchamp/lean-intent"
rev = "30fe70d3bdeec8875eab718f38374a76a1df63c4"

# The root package, whose functions the proofs of `RegulaSpecification.Proofs` are
# about, and whose `lint` executable checks this package.
[[require]]
name = "regula"
path = ".."

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.missingDocs = true
# The doc and module comments of this package are in the Verso format, whose roles Lean checks while it
# builds. The root package keeps Markdown, because its own language check refuses `doc.verso`. Module
# comments follow `doc.verso` while `doc.verso.module` is unset, and TOML cannot hold both keys.
# A code mention carries a checking role when Lean can resolve it at the comment. One that Lean cannot
# resolve there stays unchecked literal text: a declaration later in the same file, a name outside what
# the file imports, a term whose variables are out of scope, or a Lean declaration that no longer exists.
doc.verso = true

[[lean_lib]]
name = "RegulaSpecification"
