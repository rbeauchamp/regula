name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to main cancels an older run, including its deployment.
# The deploy job's dependency-free re-check additionally refuses a re-run of an older revision
# (docs/guides/website.md#publication).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; each verify.sh step enforces exactly 420 seconds.
    timeout-minutes: 45
    outputs:
      # The release this commit installs (Regula.installed), empty when it is unreleased.
      release: ${{ steps.edition.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          # The documentation step builds the Verso standard, which needs pinned Verso.
          verso: 'true'

      - name: Name the release this commit installs
        id: edition
        run: lean --run lean/Regula/Release.lean installed

      # Includes RegulaPolicy collection/finalization proofs and all acceptance
      # adapters through the existing executable and diagnostic-owner build targets.
      # Records the accepted input identity for the documentation step below.
      - name: Verify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh

      # Second required step with its own 420 seconds: the fresh acceptance of the Mathlib package
      # in audit/, then every docs/ Lean fence and every `lean` block of the Verso standard (built
      # fresh and rendered), admitted only when its inputs equal the accepted ordinary inputs at
      # this same commit.
      - name: Verify documentation fences (same command and seven-minute limit as local)
        run: ./scripts/verify.sh docs

  # The rule-example corpus: detector qualification (standard §7.8) and the only
  # source of the site's examples. Diagnostics, not a partition of acceptance.
  rule-examples:
    name: diagnostics rule-examples ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            index: 1
          - shard: '2/2'
            index: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}

      - name: Keep the shard export for the site build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rule-examples-${{ matrix.index }}of2-${{ github.sha }}
          path: tmp/rule-examples-${{ matrix.index }}of2.json
          if-no-files-found: error
          retention-days: 30

  # On main, a commit that carries the release label (Regula.installed is a release): once
  # acceptance and the corpus shards pass, tag it v<version>, so the site build below renders the
  # release's edition as publishable and writes its asset (docs/guides/contributing.md#release).
  # Until the release is published the tag is created at, or moved to, the head of main; once it
  # is published the tag never changes and this job refuses every other labelled commit, after
  # making sure the reset pull request is open (Regula.Release.tagAction).
  tag:
    needs: [verify, rule-examples]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.verify.outputs.release != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean tag

  # Rule-reference website (docs/guides/website.md): generated from the registry, the rule
  # explanations and this run's admitted corpus exports, rendered with pinned Verso and
  # checked. Separate from, and never a partition of, 420-second acceptance. It runs after
  # `tag`, which is skipped except on a release commit on main.
  site:
    needs: [rule-examples, tag]
    if: >-
      !cancelled() && needs.rule-examples.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          verso: 'true'

      - name: Receive this run's corpus exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rule-examples-*of2-${{ github.sha }}
          path: tmp
          merge-multiple: true

      # Also the libraries the standard's examples import, so the timed site build elaborates the
      # standard without building them.
      - name: Build site tooling
        timeout-minutes: 20
        run: lake build axiomGate ruleExampleQualification site AuditApp

      - name: Build the Mathlib package's library the standard's examples import
        timeout-minutes: 20
        working-directory: audit
        run: lake build Audit

      - name: Build and check the site (seven-minute limit)
        run: ./scripts/verify.sh site

      - name: Keep the validated artifact (preview and deployment check)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 30

      # Only a clean build of a release whose commit its tag v<version> names writes it: that
      # release's edition, for the release's asset.
      - name: Keep the release edition
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-release-${{ github.sha }}
          path: tmp/site-release
          if-no-files-found: ignore
          retention-days: 30

      - name: Refuse to publish a dirty, other-commit or untagged-release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: lean --run lean/Regula/Site/Deployment.lean gate _site

      - name: Upload the validated artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Privileged publication of exactly the artifact validated above, on main only, after the same
  # revision's acceptance and site jobs passed. This job holds the deployment token, so it runs
  # no checkout, provisioning or project code: only a dependency-free re-check (re-run with this
  # job) that main is still at this revision, then deploy-pages.
  # Like `site`, it tolerates a skipped `tag` (every unreleased commit).
  deploy:
    needs: [verify, site]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.site.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a revision that is no longer the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED: ${{ github.sha }}
        run: gh api "repos/{owner}/{repo}/git/ref/heads/main" --jq 'if .object.sha == env.EXPECTED then "main is at \(env.EXPECTED)" else error("main moved to \(.object.sha); not publishing \(env.EXPECTED)") end'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Observe that the live site serves this run's artifact: build.json, the home page of every
  # edition, every development rule page, the build.json of every release edition and the
  # not-available page (the files Deployment.lean compares).
  verify-deployment:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: _site

      - name: Compare the live site with the artifact
        env:
          REGULA_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: lean --run lean/Regula/Site/Deployment.lean verify _site

  # Once a release commit's edition is live, publish the GitHub release with that edition as its
  # permanent asset, then open the pull request that sets Regula.installed back to .unreleased.
  release:
    needs: [tag, verify-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the release edition
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-release-${{ github.sha }}
          path: tmp/site-release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean publish

      - name: Open the pull request that ends the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean reset
