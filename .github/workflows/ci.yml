name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to main cancels an older run, including its deployment.
# The deploy-gate job and the deploy job's dependency-free re-check additionally refuse a
# re-run of an older revision (docs/guides/website.md). Published revision snapshots are kept
# in the append-only site-archive-regula branch (docs/guides/website.md#retention).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; each verify.sh step enforces exactly 420 seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          # The documentation step builds the Verso standard, which needs pinned Verso.
          verso: 'true'

      # Includes RegulaPolicy collection/finalization proofs and all acceptance
      # adapters through the existing executable and diagnostic-owner build targets.
      # Records the accepted input identity for the documentation step below.
      - name: Verify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh

      # Second required step with its own 420 seconds: the fresh acceptance of the Mathlib package
      # in audit/, then every docs/ Lean fence and every `lean` block of the Verso standard (built
      # fresh and rendered), admitted only when its inputs equal the accepted ordinary inputs at
      # this same commit.
      - name: Verify documentation fences (same command and seven-minute limit as local)
        run: ./scripts/verify.sh docs

  # The rule-example corpus: detector qualification (standard §8.8) and the only
  # source of the site's examples. Diagnostics, not a partition of acceptance.
  rule-examples:
    name: diagnostics rule-examples ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            index: 1
          - shard: '2/2'
            index: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}

      - name: Keep the shard export for the site build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rule-examples-${{ matrix.index }}of2-${{ github.sha }}
          path: tmp/rule-examples-${{ matrix.index }}of2.json
          if-no-files-found: error
          retention-days: 30

  # Rule-reference website (docs/guides/website.md): generated from the registry, the rule
  # explanations and this run's admitted corpus exports, rendered with pinned Verso and
  # checked. Separate from, and never a partition of, 420-second acceptance.
  site:
    needs: rule-examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          verso: 'true'

      - name: Receive this run's corpus exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rule-examples-*of2-${{ github.sha }}
          path: tmp
          merge-multiple: true

      # Also the libraries the standard's examples import, so the timed site build elaborates the
      # standard without building them.
      - name: Build site tooling
        timeout-minutes: 20
        run: lake build axiomGate ruleExampleQualification site AuditApp

      - name: Build the Mathlib package's library the standard's examples import
        timeout-minutes: 20
        working-directory: audit
        run: lake build Audit

      - name: Build and check the site (seven-minute limit)
        run: ./scripts/verify.sh site

      - name: Keep the validated artifact (preview and deployment check)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 30

      - name: Upload the validated artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Unprivileged gate: only a clean artifact of the current head of main, after the same
  # revision's acceptance and site jobs passed, whose revision snapshots are exactly the site
  # archive's plus its own, may proceed. It writes the next archive commit as a bundle.
  deploy-gate:
    needs: [verify, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive-parent: ${{ steps.gate.outputs.archive-parent }}
      archive-commit: ${{ steps.gate.outputs.archive-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: _site

      - name: Refuse a dirty artifact, a revision that is no longer the head of main, or changed archived snapshots
        id: gate
        run: lean --run lean/Regula/Site/Deployment.lean gate _site

      - name: Keep the next archive commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-archive-${{ github.sha }}
          path: tmp/site-archive.bundle
          if-no-files-found: error
          retention-days: 30

  # Append this revision's snapshot to the site archive before it can be published. This job
  # can write repository contents, so it runs no provisioning or project code: it fetches the
  # gate's bundle and pushes it without force, so a concurrent writer fails the push instead of
  # losing a snapshot.
  archive:
    needs: deploy-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Receive the next archive commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-archive-${{ github.sha }}
          path: tmp

      - name: Fetch the archive head the bundle extends
        if: needs.deploy-gate.outputs.archive-parent != ''
        run: git fetch --depth=1 --no-tags origin refs/heads/site-archive-regula:refs/heads/site-archive-regula

      - name: Apply the bundle (a fast-forward of the fetched head)
        run: git fetch --no-tags tmp/site-archive.bundle refs/heads/site-archive-regula:refs/heads/site-archive-regula

      - name: Push the archive without force
        run: git push origin refs/heads/site-archive-regula:refs/heads/site-archive-regula

  # Privileged publication of exactly the artifact validated above. This job holds the
  # deployment token, so it runs no checkout, provisioning or project code: only
  # dependency-free re-checks (re-run with this job) that the archive head is the commit this
  # run archived and that main is still at this revision, then deploy-pages.
  deploy:
    needs: [deploy-gate, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse unless the site archive is exactly this artifact's snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVED: ${{ needs.deploy-gate.outputs.archive-commit }}
        run: gh api "repos/{owner}/{repo}/git/ref/heads/site-archive-regula" --jq 'if .object.sha == env.ARCHIVED then "site-archive-regula is at \(env.ARCHIVED)" else error("site-archive-regula moved to \(.object.sha); this artifact retains \(env.ARCHIVED)") end'

      - name: Refuse a revision that is no longer the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED: ${{ github.sha }}
        run: gh api "repos/{owner}/{repo}/git/ref/heads/main" --jq 'if .object.sha == env.EXPECTED then "main is at \(env.EXPECTED)" else error("main moved to \(.object.sha); not publishing \(env.EXPECTED)") end'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Observe that the live site serves this run's artifact: build.json, every rule page of
  # every edition, the build.json of every revision snapshot and the not-available page (the
  # files Deployment.lean compares).
  verify-deployment:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: _site

      - name: Compare the live site with the artifact
        env:
          REGULA_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: lean --run lean/Regula/Site/Deployment.lean verify _site
