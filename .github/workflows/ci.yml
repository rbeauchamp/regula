name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to main cancels an older run, including its deployment.
# The deploy job's dependency-free re-check additionally refuses a re-run of an older revision
# (docs/guides/website.md#publication).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required acceptance check; setup failures fail this job.
  verify:
    if: always()
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; each verify.sh step enforces exactly 420 seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          # The documentation step builds the Verso standard, which needs pinned Verso.
          verso: 'true'

      # Only the release commit, which is not on main, carries a release label.
      - name: Refuse a release label on main or a pull request
        run: lean --run lean/Regula/Release.lean unreleased

      # The lakefile's version, as Lake reads it, is the latest listed release's, and the adoption
      # guide's compatibility table lists every release of Regula.releases with its toolchain.
      - name: Refuse a lakefile version or compatibility table the release data contradicts
        run: lean --run lean/Regula/Release.lean agree

      # Includes RegulaPolicy collection/finalization proofs and all acceptance
      # adapters through the existing executable and diagnostic-owner build targets.
      # Records the accepted input identity for the documentation step below.
      - name: Verify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh

      # Second required step with its own 420 seconds: the rule-ID check of every Markdown document
      # Git tracks (which needs the Git checkout), the fresh acceptance of the example package in
      # audit/, then every docs/ Lean fence and every `lean` block of the Verso standard (built
      # fresh and rendered), admitted only when its inputs equal the accepted ordinary inputs at
      # this same commit.
      - name: Verify documentation fences (same command and seven-minute limit as local)
        run: ./scripts/verify.sh docs

  # The Mathlib integration check (docs/guides/contributing.md#mathlib-integration-check): the
  # fresh acceptance and lint of the Mathlib integration package in integration/mathlib/, a
  # Mathlib adopter of the checker. It is the only job that downloads, caches or builds Mathlib,
  # and no other job needs its result: acceptance, the corpus, the site and a release require no
  # Mathlib. Its result is about the toolchain and Mathlib revision that package pins.
  # A mismatched pin fails the integration preflight instead of skipping the check.
  mathlib:
    name: mathlib integration
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; the verify.sh step enforces exactly 420 seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          mathlib: 'true'

      - name: Check the Mathlib integration package (same command and seven-minute limit as local)
        run: ./scripts/verify.sh mathlib

  # The rule-example corpus: detector qualification (standard §7.8) and the only
  # source of the site's examples. Diagnostics, not a partition of acceptance.
  rule-examples:
    if: always()
    name: diagnostics rule-examples ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            index: 1
          - shard: '2/2'
            index: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}

      - name: Keep the shard export for the site build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rule-examples-${{ matrix.index }}of2-${{ github.sha }}
          path: tmp/rule-examples-${{ matrix.index }}of2.json
          if-no-files-found: error
          retention-days: 30

  # On main, once acceptance and the corpus shards pass: when main lists a release that is not
  # yet published, and its bump from the release listed before it is at least the bump the
  # commits of main since that release call for (Regula.Release.covers), create the release
  # commit (a signed child of this commit, not on main, whose only change sets Regula.installed
  # to the release) and point release/v<version>-candidate at it. Nothing public exists yet: the
  # jobs below run main's checks on the release commit, and only once they all pass does
  # `publish` publish the release, which creates tag v<version> at it. Once the release is
  # published this job releases nothing (Regula.Release.tagAction,
  # docs/guides/contributing.md#release). The derivation reads main's history since the earlier
  # release's tag, hence the full clone.
  candidate:
    needs: [verify, rule-examples]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # The release commit and its tree, both empty when there is nothing to release.
      commit: ${{ steps.candidate.outputs.commit }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/provision

      - name: Create the release commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean candidate

  # Both acceptance steps on the release commit, with its release label and the same budget as
  # `verify`; its build is where the kernel checks release_attributes_rules for the release. Like
  # `release-site`, it checks out this commit of main, not the release commit: `adopt` derives the
  # release commit's content from it with main's own code, checks that it is the release commit's
  # tree on this commit, and only then adopts the release commit's name, taking no file from it
  # (Regula.Release.adopt).
  release-verify:
    needs: candidate
    if: needs.candidate.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.adopt.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          verso: 'true'

      - name: Derive, check and adopt the release commit
        id: adopt
        env:
          RELEASE_TREE: ${{ needs.candidate.outputs.tree }}
        run: lean --run lean/Regula/Release.lean adopt

      - name: Verify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh

      - name: Verify documentation fences (same command and seven-minute limit as local)
        run: ./scripts/verify.sh docs

  # The release commit's corpus shards and site build, one after another: its budget of 105
  # minutes is 30 + 30 + 45, the budgets of the two `rule-examples` shards and `site` it repeats.
  # It adopts the release commit as `release-verify` does. Before the tag exists, its site build
  # renders the release's edition from source and writes it as the release asset
  # (Regula.releaseSource).
  release-site:
    needs: candidate
    if: needs.candidate.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    outputs:
      commit: ${{ steps.adopt.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          verso: 'true'

      - name: Derive, check and adopt the release commit
        id: adopt
        env:
          RELEASE_TREE: ${{ needs.candidate.outputs.tree }}
        run: lean --run lean/Regula/Release.lean adopt

      - name: Qualify shard 1/2 (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples 1/2

      - name: Qualify shard 2/2 (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples 2/2

      - name: Build site tooling
        timeout-minutes: 20
        run: lake build axiomGate ruleExampleQualification site AuditApp

      - name: Build the example library the standard's examples import
        timeout-minutes: 20
        working-directory: audit
        run: lake build Audit

      - name: Build and check the site (seven-minute limit)
        run: ./scripts/verify.sh site

      - name: Keep the release edition
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-release-${{ needs.candidate.outputs.commit }}
          path: tmp/site-release
          if-no-files-found: error
          retention-days: 30

  # Only once every check of the release commit passed: publish the GitHub release with that
  # commit's edition as its permanent asset, which creates tag v<version> at the commit, before
  # the site build of main, which then takes that edition from the asset. It refuses unless both
  # checking jobs adopted the release commit.
  publish:
    needs: [candidate, release-verify, release-site]
    if: needs.candidate.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the release edition
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-release-${{ needs.candidate.outputs.commit }}
          path: tmp/site-release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
          VERIFIED_COMMIT: ${{ needs.release-verify.outputs.commit }}
          SITE_COMMIT: ${{ needs.release-site.outputs.commit }}
        run: lean --run lean/Regula/Release.lean publish

  # Rule-reference website (docs/guides/website.md): generated from the registry, the rule
  # explanations and this run's admitted corpus exports, rendered with pinned Verso and
  # checked. Separate from, and never a partition of, 420-second acceptance. On main it runs after
  # `publish`, so it takes a release's edition from the asset published in this run. `candidate`
  # and `publish` are skipped on pull requests; `publish` is also skipped when there is nothing to
  # release, and when `release-verify` or `release-site` fails. While the latest listed release
  # has neither asset nor tag, on the release pull request and on main until it is published, the
  # build previews its edition from this commit and records the artifact as not publishable
  # (Regula.releaseSource_preview_iff): the pull request's check passes, and on main the
  # deployment gate below refuses, so this job fails and nothing is deployed.
  site:
    needs: [rule-examples, candidate, publish]
    if: >-
      !cancelled() && needs.rule-examples.result == 'success' &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          verso: 'true'

      - name: Receive this run's corpus exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rule-examples-*of2-${{ github.sha }}
          path: tmp
          merge-multiple: true

      # Also the libraries the standard's examples import, so the timed site build elaborates the
      # standard without building them.
      - name: Build site tooling
        timeout-minutes: 20
        run: lake build axiomGate ruleExampleQualification site AuditApp

      - name: Build the example library the standard's examples import
        timeout-minutes: 20
        working-directory: audit
        run: lake build Audit

      - name: Build and check the site (seven-minute limit)
        run: ./scripts/verify.sh site

      - name: Keep the validated artifact (preview and deployment check)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 30

      - name: Refuse to publish a dirty, other-commit or re-rendered-release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: lean --run lean/Regula/Site/Deployment.lean gate _site

      - name: Upload the validated artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Privileged publication of exactly the artifact validated above, on main only, after the same
  # revision's acceptance and site jobs passed. This job holds the deployment token, so it runs
  # no checkout, provisioning or project code: only a dependency-free re-check (re-run with this
  # job) that main is still at this revision, then deploy-pages.
  # Like `site`, it tolerates skipped release jobs (pull requests and runs with nothing to release).
  deploy:
    needs: [verify, site]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.site.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a revision that is no longer the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED: ${{ github.sha }}
        run: gh api "repos/{owner}/{repo}/git/ref/heads/main" --jq 'if .object.sha == env.EXPECTED then "main is at \(env.EXPECTED)" else error("main moved to \(.object.sha); not publishing \(env.EXPECTED)") end'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Observe that the live site serves this run's artifact: build.json, the home page of every
  # edition, every development rule page, the build.json of every release edition and the
  # not-available page (the files Deployment.lean compares).
  verify-deployment:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Receive the validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: _site

      - name: Compare the live site with the artifact
        env:
          REGULA_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: lean --run lean/Regula/Site/Deployment.lean verify _site
