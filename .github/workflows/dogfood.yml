name: Dogfood

# Regula run on its own code base (docs/guides/contributing.md#repository-conformance):
# the repository's own `lake lint` through `regula/lint` in both packages, and the operational
# self-audit of the excluded `Regula` library. Neither is part of acceptance; each verify.sh
# partition keeps its own 420-second limit. It runs when a path listed below changes, always
# on main, and nightly.
on:
  pull_request:
    paths:
      - lean/**
      - audit/**
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - dependency-build-mode
      - .github/compiler-source.json
      - .github/snapshot-compiler.json
      - .github/compiler-snapshot.json
      - foundation_manifest.json
      - scripts/verify.sh
      - .github/workflows/dogfood.yml
      - .github/workflows/compiler.yml
      - .github/workflows/snapshot.yml
      - .github/actions/provision/**
  push:
    branches: [main]
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    uses: ./.github/workflows/compiler.yml

  # Follows `compiler` only to reuse its cache; as for CI's `verify`, it runs whatever that job's
  # result, so a failed preparation cannot leave it skipped.
  self:
    needs: compiler
    if: always()
    name: ${{ matrix.campaign }}
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        campaign:
          - diagnostics self-lint
          - diagnostics self-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Check (same command and seven-minute limit as local)
        run: ./scripts/verify.sh ${{ matrix.campaign }}
