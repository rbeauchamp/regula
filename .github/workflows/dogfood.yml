name: Dogfood

# Regula run on its own code base (docs/guides/contributing.md#repository-conformance):
# the repository's own `lake lint` through `regula/lint` in both packages, and the operational
# self-audit of the excluded `Regula` library, in four shards that together audit every module the
# single run does. Neither is part of acceptance; each verify.sh partition keeps its own 420-second
# limit. It runs on dispatch alone, never on a schedule, a pull request or a push: the gate of a
# change is the local gate, which runs the `self` campaigns on each commit the no-mistakes validation
# pipeline validates (docs/guides/contributing.md#the-local-gate). The default-path lint of the
# root package, without the owner's `REGULA_ORDINARY_LAKEFILES=1`, runs on dispatch too.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self:
    if: always()
    name: ${{ matrix.campaign }}
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        campaign:
          - diagnostics self-lint
          - diagnostics self-audit 1/4
          - diagnostics self-audit 2/4
          - diagnostics self-audit 3/4
          - diagnostics self-audit 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision
        with:
          # The shard 4/4 runs `qualify observers`, which loads the `markdown/` workspace and
          # refuses unless its pinned MD4Lean is checked out: the Verso provisioning acquires it.
          verso: ${{ matrix.campaign == 'diagnostics self-audit 4/4' && 'true' || 'false' }}

      - name: Check (same command and seven-minute limit as local)
        run: ./scripts/verify.sh ${{ matrix.campaign }}

  default-path:
    if: github.event_name == 'workflow_dispatch'
    name: diagnostics self-lint-default
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Check (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics self-lint-default
