name: Diagnostics

# Capability-triggered qualification campaigns (standard §7.8): the producer and history
# campaigns, the `lake lint` dispatch over the maintained adopter fixtures, which crosses
# Lake, process and filesystem boundaries that the driver's proofs do not cover, and the
# checker self-test's structural and execution partitions, each in two shards whose controls
# together are the partition's. They are diagnostics, not a partition of ordinary acceptance.
#
# The workflow runs on every pull request, every push to main, nightly and on dispatch. Its first
# job, `applies`, decides which partition jobs apply to the run (lean/Regula/DiagnosticsGate.lean):
# the campaigns on a pull request exactly when it changes one of the paths listed there
# (`inputs`, the only statement of them: the checker, rules, rule examples, adopter fixtures, the
# application and fixture sources the structural and execution partitions mutate, Lake
# configuration and manifests), and on every other run; the nightly rule-example shards on the
# schedule alone. Each partition job runs only when it applies. The last job, `diagnostics`, runs
# once every other job has finished, whatever their results, and passes exactly when `applies`
# succeeded and each partition job passed and applies, or was skipped and does not apply
# (`verdict_iff`); a failed, cancelled or timed-out job fails it. The ruleset of main requires that
# check, so a pull request merges only once every diagnostics job that applies to it has passed on
# its head commit, and one that changes no input passes it without running a campaign. Every job
# other than `applies` and `diagnostics` is in the `needs` of `diagnostics` and has its `if:` read
# its own decision; the gate refuses a job it needs that `applies` did not decide, and a decided
# job it does not need.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A JSON object from partition job id to whether that job applies. On a pull request the
  # checked-out commit is the merge commit GitHub creates, and the step compares it with its first
  # parent, the head of the base branch: hence the two commits.
  applies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      decisions: ${{ steps.decide.outputs.decisions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # The decision needs the pinned toolchain alone.
      - uses: ./.github/actions/provision
        with:
          dependencies: 'false'

      - name: Decide which diagnostics apply
        id: decide
        run: lean --run lean/Regula/DiagnosticsGate.lean applies

  campaign:
    name: ${{ matrix.campaign }}
    needs: applies
    if: fromJSON(needs.applies.outputs.decisions).campaign
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        campaign:
          - diagnostics producers
          - diagnostics history
          - diagnostics lint-driver
          - diagnostics structural 1/2
          - diagnostics structural 2/2
          - diagnostics execution 1/2
          - diagnostics execution 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh ${{ matrix.campaign }}

  # CI runs the two rule-example shards on every change. Like the campaigns above, they also
  # run nightly on an unchanged main, where a failure shows drift in the runner image or the
  # restored dependency caches rather than in the pinned sources.
  rule-examples-nightly:
    name: nightly diagnostics rule-examples ${{ matrix.shard }}
    needs: applies
    if: fromJSON(needs.applies.outputs.decisions)['rule-examples-nightly']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}

  # The required check. `always()`, not `!cancelled()`: a skipped job reports success, so the
  # gate runs on a cancelled run too, where it fails.
  diagnostics:
    needs: [applies, campaign, rule-examples-nightly]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate needs the pinned toolchain alone.
      - uses: ./.github/actions/provision
        with:
          dependencies: 'false'

      - name: Refuse unless every diagnostics job passed exactly when it applies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: lean --run lean/Regula/DiagnosticsGate.lean gate
