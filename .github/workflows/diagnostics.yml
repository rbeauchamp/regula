name: Diagnostics

# Capability-triggered qualification campaigns (standard §7.8): the producer and history
# campaigns, the `lake lint` dispatch over the maintained adopter fixtures, which crosses
# Lake, process and filesystem boundaries that the driver's proofs do not cover, the structural
# and execution partitions of the checker self-test, each in shards, and five groups of `qualify`
# and focused self-test controls; the controls of a partition's shards together are the
# partition's. The other partitions and groups are too long for a job, except `readers`, which
# needs the generated website sources, Verso and a provisioned Mathlib together. The list is
# Regula.DiagnosticsGate.campaigns, which the inventory of campaigns (Regula.Campaigns) counts. They
# are diagnostics, not a partition of ordinary acceptance.
#
# The workflow runs on dispatch alone, never on a schedule, a pull request or a push: the gate of a
# change is the local gate, which runs the campaigns and compares the digests on each commit the
# no-mistakes validation pipeline validates (docs/guides/contributing.md#the-local-gate). Its first
# job, `applies`, provisions the released compiler and decides which partition jobs apply to the run
# (lean/Regula/DiagnosticsGate.lean): the campaigns and the three rule-example shards of
# `rule-examples-nightly` on every run. Each partition job runs only when
# it applies. The last job, `diagnostics`, runs once every other job has finished,
# whatever their results, and passes exactly when `applies` succeeded and each partition job passed
# and applies, or was skipped and does not apply (`verdict_iff`); a failed, cancelled or timed-out
# job fails it. When the campaigns apply, it also refuses unless the self-hosted digests that the
# structural shards 1/5 and 5/5 upload are present, well-formed and equal
# (`digestRefusals_eq_nil_iff`). Every job other than `applies` and
# `diagnostics` is in the `needs` of `diagnostics` and has its `if:` read its own decision; the
# gate refuses a job it needs that `applies` did not decide, and a decided job it does not need.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A JSON object from partition job id to whether that job applies.
  applies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      decisions: ${{ steps.decide.outputs.decisions }}
      campaigns: ${{ steps.decide.outputs.campaigns }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The decision needs the pinned toolchain alone.
      - uses: ./.github/actions/provision

      - name: Decide which diagnostics apply
        id: decide
        run: lean --run lean/Regula/DiagnosticsGate.lean applies

  campaign:
    name: ${{ matrix.campaign }}
    needs: applies
    if: fromJSON(needs.applies.outputs.decisions).campaign
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The invocations of `verify.sh` that `applies` writes (Regula.DiagnosticsGate.campaigns),
        # which the inventory of campaigns counts (Regula.Campaigns.Diagnostics.campaigns_eq).
        campaign: ${{ fromJSON(needs.applies.outputs.campaigns) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh ${{ matrix.campaign }}

      # The digest of the fresh input the self-hosted positive's gate accepted (shard 1/5) and of
      # the restored self-hosted copy's (shard 5/5), for the gate to compare. Named by commit, not
      # attempt, so partial reruns (Re-run failed jobs) keep working: a shard that is not rerun
      # keeps its digest for this commit, and a rerun shard overwrites its own. A digest from an
      # earlier attempt of the run is of the same commit, so it is not stale.
      - name: Keep the self-hosted digest for the gate
        if: matrix.campaign == 'diagnostics structural 1/5' || matrix.campaign == 'diagnostics structural 5/5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-hosted-digest-${{ strategy.job-index }}-${{ github.sha }}
          path: tmp/self-hosted-digest/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  # The local gate runs the three rule-example shards on every change. Here they run on dispatch, as
  # the nightly schedule ran them before: on an unchanged main a failure shows drift in the runner
  # image or the restored toolchain cache rather than in the pinned sources.
  rule-examples-nightly:
    name: drift diagnostics rule-examples ${{ matrix.shard }}
    needs: applies
    if: fromJSON(needs.applies.outputs.decisions)['rule-examples-nightly']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}

  # The gate of the run. `always()`, not `!cancelled()`: a skipped job reports success, so the
  # gate runs on a cancelled run too, where it fails.
  diagnostics:
    needs: [applies, campaign, rule-examples-nightly]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate needs the pinned toolchain alone.
      - uses: ./.github/actions/provision

      # The latest digest of each structural shard for this commit. None when the campaigns did
      # not run or a structural shard never passed; the gate decides.
      - name: Receive this commit's self-hosted digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: self-hosted-digest-*-${{ github.sha }}
          path: tmp/self-hosted-digest
          merge-multiple: true

      - name: Refuse unless every diagnostics job passed exactly when it applies and the self-hosted digests agree
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: lean --run lean/Regula/DiagnosticsGate.lean gate
