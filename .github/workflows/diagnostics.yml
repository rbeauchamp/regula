name: Diagnostics

# Capability-triggered qualification campaigns (standard §7.8): the producer and history
# campaigns, the `lake lint` dispatch over the maintained adopter fixtures, which crosses
# Lake, process and filesystem boundaries that the driver's proofs do not cover, and the
# checker self-test's structural and execution partitions, each in two shards whose controls
# together are the partition's. They run when a path listed below changes, always on main,
# and nightly. They are diagnostics, not a partition of ordinary acceptance.
on:
  pull_request:
    paths:
      - lean/Regula/**
      - lean/RegulaPolicy/**
      - lean/RegulaPolicy.lean
      - lean/RegulaCore/**
      - lean/RegulaQualification/**
      - lean/RegulaVerification.lean
      - lean/RegulaProvision.lean
      - lean/RegulaCompiler.lean
      - dependency-build-mode
      - .github/compiler-source.json
      - lean/AuditApp/**
      - lean/AuditApp.lean
      - lean/Main.lean
      - lean/Fixtures/**
      - audit/lakefile.lean
      - audit/lake-manifest.json
      - audit/foundation_manifest.json
      - examples/rules/**
      - examples/lake-lint-toml/**
      - examples/build-lint/**
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - foundation_manifest.json
      - scripts/verify.sh
      - .github/workflows/diagnostics.yml
      - .github/workflows/compiler.yml
      - .github/actions/provision/**
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    uses: ./.github/workflows/compiler.yml

  campaign:
    needs: compiler
    name: ${{ matrix.campaign }}
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        campaign:
          - diagnostics producers
          - diagnostics history
          - diagnostics lint-driver
          - diagnostics structural 1/2
          - diagnostics structural 2/2
          - diagnostics execution 1/2
          - diagnostics execution 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh ${{ matrix.campaign }}

  # CI runs the two rule-example shards on every change. Like the campaigns above, they also
  # run nightly on an unchanged main, where a failure shows drift in the runner image or the
  # restored dependency caches rather than in the pinned sources.
  rule-examples-nightly:
    needs: compiler
    name: nightly diagnostics rule-examples ${{ matrix.shard }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics rule-examples ${{ matrix.shard }}
