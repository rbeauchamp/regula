name: Release

# One action starts a release: run this workflow on main (docs/guides/contributing.md#release).
# It derives the version from the Conventional Commits types of main's commits since the previous
# release and from lean-toolchain; its bump input may raise that bump, never lower it. It creates
# the branch of the release pull request, which lists the release with its toolchain, sets the
# lakefile's version, adds it to the adoption guide's compatibility table and stamps it into the
# rules; a maintainer opens that pull request from the link in the job summary. While it observes
# a release pull request for that version open, it refuses and creates no branch: close that pull
# request first, run this workflow again and open a fresh one from the new link. Separately, a
# run writes a branch only by creating a new one, so no run moves a branch that exists. Once the
# pull request merges, ci.yml on main creates the release commit, runs main's checks on it and,
# once they pass, publishes the release, which creates its tag. No workflow creates a pull
# request. Every step is lean/Regula/Release.lean.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Raise the derived bump (a patch for fix and perf, a minor bump for feat, a toolchain
          move or, before 1.0, a breaking change); derived keeps it. It never lowers the bump.
        type: choice
        options: [derived, patch, minor, major]
        default: derived

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compiler:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/compiler.yml

  # Derive the version, then create the commit of the release pull request (main's commit with
  # the release appended to Regula.releases with its toolchain, the lakefile's version, the
  # adoption guide's compatibility table and each .unreleased on a `lifecycle :=` line;
  # Regula.installed stays .unreleased), refuse unless GitHub verified its signature, create the
  # branch release/v<version>-<commit>, named after that commit, and write the link that opens
  # its pull request to the job summary. main's rules count a push by this job to the branch of
  # an open pull request as an unattributed change, and block its merge until a review approves
  # it, so the job keeps two guarantees. For what it observed: just before it writes the branch,
  # it lists the open pull requests, hence `pull-requests: read`, and while one is from a branch
  # release/v<version>-... of this repository it writes the refusal to the job summary, writes no
  # reference and fails (Regula.Release.branchAction). By construction, whatever it observed: it
  # writes a branch only by creating it, with the request GitHub refuses when the name exists,
  # and never moves one. While it observes no such pull request, a re-run builds on the same
  # commit of main, and a new run on its current head; each creates its own branch. The
  # derivation reads main's history since the previous release's tag, hence the full clone.
  open:
    needs: compiler
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/provision

      - name: Create the branch of the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: lean --run lean/Regula/Release.lean open
