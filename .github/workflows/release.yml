name: Release

# One action starts a release: run this workflow on main (docs/guides/contributing.md#release).
# Its version is the Lean release in lean-toolchain, the Lean ecosystem's tag convention. It pushes
# the release branch; a maintainer opens its pull request from the link in the job summary. Once
# that merges, ci.yml on main tags, deploys and publishes the release and pushes the branch that
# ends it, whose pull request a maintainer opens the same way. No workflow creates a pull
# request. Every step is lean/Regula/Release.lean.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Create the release commit (main's commit with Regula.installed set to the release, the
  # release appended to Regula.releases and stamped into every rule lifecycle position still
  # .unreleased), refuse unless GitHub verified its signature, push it as release/v<version> and
  # write the link that opens its pull request to the job summary. A re-run rebuilds the branch on
  # the same commit; a new run rebuilds it on the current head of main.
  open:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Push the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean open
