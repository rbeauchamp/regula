name: Prepare compiler

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    # Source compilation is setup. Acceptance retains its own existing deadline.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
        with:
          dependencies: 'false'
