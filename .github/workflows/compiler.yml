name: Prepare compiler

on:
  workflow_call:
    outputs:
      mathlib:
        description: >-
          'true' exactly when the Mathlib integration check applies to this commit: no compiler
          snapshot is selected and the Mathlib integration package selects this toolchain
          (RegulaProvision.mathlibApplies). CI schedules the integration job only then.
        value: ${{ jobs.compiler.outputs.mathlib }}

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    # Source compilation is setup. Acceptance retains its own existing deadline.
    timeout-minutes: 45
    outputs:
      mathlib: ${{ steps.mathlib.outputs.mathlib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/provision
        with:
          dependencies: 'false'

      # Decided before the integration job is scheduled, so a commit the check does not apply to
      # shows that job as skipped; this step's log states the reason and that the check is
      # INCOMPLETE there.
      - name: Decide whether the Mathlib integration check applies
        id: mathlib
        run: lean --run lean/RegulaProvision.lean mathlib-applies
