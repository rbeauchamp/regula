name: Title

# A pull request merges by squash, so its title becomes the subject of its commit on main, and the
# Release workflow derives the next version from those subjects' Conventional Commits types
# (docs/guides/contributing.md#pull-request-titles). This required check refuses a title that is
# not a Conventional Commits header. It runs again when the title is edited and on every push, so
# it always reports on the head commit. A push with a workflow's token starts no workflow, so the
# Release workflow dispatches this one on the branch of an open pull request it rebuilds; the
# dispatched check reads that pull request's title through GitHub's API and refuses unless the
# pull request's head is the checked-out commit. The check is lean/Regula/Release.lean's `title`
# step.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The check needs the pinned toolchain alone.
      - uses: ./.github/actions/provision
        with:
          dependencies: 'false'

      # A pull_request event carries its title; a dispatched run reads it through the API.
      - name: Refuse a title that is not a Conventional Commits header
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: lean --run lean/Regula/Release.lean title
