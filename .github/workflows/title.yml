name: Title

# A pull request merges by squash, so its title becomes the subject of its commit on main, and the
# Release workflow derives the next version from those subjects' Conventional Commits types
# (docs/guides/contributing.md#pull-request-titles). This check refuses a title that is not a
# Conventional Commits header. It runs on dispatch, with the title to check as its input, and never
# on a pull request: the no-mistakes validation pipeline drafts each title as such a header, and a
# release leaves its bump undecided, for its `bump` input to give, when a subject since the previous
# release is not one (Regula.Release.derive_eq_none). The check is
# lean/Regula/Release.lean's `title` step, and reads the title the dispatch gives.
on:
  workflow_dispatch:
    inputs:
      title:
        description: The pull request title to check.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # The check provisions the released compiler itself.
  title:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The check needs the pinned toolchain alone.
      - uses: ./.github/actions/provision

      - name: Refuse a title that is not a Conventional Commits header
        env:
          TITLE: ${{ inputs.title }}
        run: lean --run lean/Regula/Release.lean title
