name: Lint driver

# The `lake lint` dispatch and the maintained adopter fixtures (standard §8.8).
# They cross Lake, process and filesystem boundaries that the driver's proofs do not
# cover, so this campaign runs when the driver or anything it imports changes, always
# on main, and nightly.
# It is a diagnostic, not a partition of ordinary acceptance.
on:
  pull_request:
    paths:
      - examples/lake-lint-toml/**
      - examples/build-lint/**
      - lean/Regula/**
      - lean/RegulaPolicy/**
      - lean/RegulaPolicy.lean
      - lean/RegulaCore/**
      - lean/RegulaQualification/**
      - lean/RegulaVerification.lean
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - foundation_manifest.json
      - scripts/verify.sh
      - .github/workflows/lint-driver.yml
      - .github/actions/provision/**
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    name: diagnostics lint-driver
    runs-on: ubuntu-24.04
    # Provisioning has its own allowance; verify.sh enforces exactly 420 seconds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/provision

      - name: Qualify (same command and seven-minute limit as local)
        run: ./scripts/verify.sh diagnostics lint-driver
