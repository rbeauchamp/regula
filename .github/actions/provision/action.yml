name: Provision pinned Lean and dependencies
description: >-
  Restore or install the pinned Elan/Lean toolchain and required system tools, then, when
  asked, restore or provision pinned Lake dependency artifacts. Provisioning only: no policy,
  validation or test orchestration.

inputs:
  mathlib:
    description: >-
      Also restore or provision the pinned Mathlib of the Mathlib integration package in
      `integration/mathlib/`. Only the Mathlib integration job turns it on; no other job
      downloads, caches or builds Mathlib.
    required: false
    default: 'false'
  verso:
    description: >-
      Also restore or provision the website package's pinned Verso dependencies in the root
      `.lake/packages` (the standard's check and the site need them).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore pinned toolchain
      id: toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.elan/toolchains
        key: lean-toolchain-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lean/RegulaPolicy/Compiler.lean') }}

    - name: Install Elan and pinned Lean
      env:
        ELAN_TARGET: ${{ runner.os == 'Linux' && runner.arch == 'X64' && 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' && runner.arch == 'ARM64' && 'aarch64-apple-darwin' || '' }}
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$ELAN_TARGET.tar.gz" \
          -o "$RUNNER_TEMP/elan.tar.gz"
        tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/elan-init" -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1

    - name: Install Linux bootstrap tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v timeout >/dev/null || ! command -v shellcheck >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes coreutils shellcheck
        fi

    - name: Install macOS bootstrap tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils shellcheck
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Check bootstrap tools
      shell: bash
      run: |
        timeout --version
        shellcheck --version

    - name: Check released compiler setup
      shell: bash
      run: lean --run lean/RegulaProvision.lean

    - name: Save pinned toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.elan/toolchains
        key: ${{ steps.toolchain.outputs.cache-primary-key }}

    - name: Restore pinned Mathlib
      if: inputs.mathlib == 'true'
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Cache dependency checkouts and unpacked artifacts, never root builds
        # or duplicate Mathlib download archives. No cross-pin restore fallback. The Mathlib
        # integration package pins every dependency here and keeps its own packages directory.
        path: |
          integration/mathlib/.lake/packages
        key: lean-dependencies-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lean/RegulaPolicy/Compiler.lean', 'integration/mathlib/lean-toolchain', 'integration/mathlib/lake-manifest.json', 'integration/mathlib/lakefile.lean') }}

    # The plan runs `cache get` in the integration package, whose own `.lake/packages` is where
    # Mathlib's cache tool unpacks its dependencies' archives.
    - name: Provision or admit Mathlib artifacts
      if: inputs.mathlib == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: lean --run lean/RegulaProvision.lean mathlib

    # Save provisioned dependencies before verification, even if it later fails.
    - name: Save pinned Mathlib
      if: inputs.mathlib == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          integration/mathlib/.lake/packages
        key: ${{ steps.dependencies.outputs.cache-primary-key }}

    # The website package's dependencies (Verso and its own: SubVerso, MD4Lean, illuminate, Cli,
    # plausible), pinned by its lock manifest in the root `.lake/packages`.
    - name: Restore pinned Verso dependencies
      if: inputs.verso == 'true'
      id: verso
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
          .lake/packages/Cli
          .lake/packages/plausible
        key: verso-shared-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lean/RegulaPolicy/Compiler.lean', 'website/lean-toolchain', 'website/lake-manifest.json') }}

    - name: Provision pinned Verso
      if: inputs.verso == 'true'
      shell: bash
      run: lean --run lean/RegulaProvision.lean verso

    - name: Save pinned Verso dependencies
      if: inputs.verso == 'true' && steps.verso.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
          .lake/packages/Cli
          .lake/packages/plausible
        key: ${{ steps.verso.outputs.cache-primary-key }}
