name: Provision pinned Lean and dependencies
description: >-
  Restore or install the pinned Elan/Lean toolchain and required system tools, then
  restore or provision pinned Lake dependency artifacts. Provisioning only: no policy,
  validation or test orchestration.

inputs:
  dependencies:
    description: >-
      Restore or provision the pinned Lake dependency artifacts (Mathlib and its dependencies).
      A job that runs only toolchain scripts, such as the title check, turns it off.
    required: false
    default: 'true'
  verso:
    description: >-
      Also restore or provision the website package's pinned Verso dependencies, which share
      the root `.lake/packages` with the Mathlib package in `audit/` (the standard's check and
      the site need them).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore pinned toolchain
      id: toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan/toolchains
          ~/.cache/regula-compilers
        key: lean-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', '.github/compiler-source.json', 'lean/RegulaCompiler.lean') }}

    - name: Install Elan and pinned Lean
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
          -o "$RUNNER_TEMP/elan.tar.gz"
        tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/elan-init" -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
        if ! command -v timeout >/dev/null || ! command -v shellcheck >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes coreutils shellcheck
        fi
        timeout --version
        shellcheck --version

    - name: Install the declared compiler
      shell: bash
      run: elan run leanprover/lean4:v4.34.0 lean --run lean/RegulaCompiler.lean

    - name: Save pinned toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan/toolchains
          ~/.cache/regula-compilers
        key: ${{ steps.toolchain.outputs.cache-primary-key }}

    - name: Read dependency artifact identity
      if: inputs.dependencies == 'true' || inputs.verso == 'true'
      id: dependency-plan
      shell: bash
      run: lean --run lean/RegulaProvision.lean identity

    - name: Restore pinned dependencies
      if: inputs.dependencies == 'true'
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Cache dependency checkouts and unpacked artifacts, never root builds
        # or duplicate Mathlib download archives. No cross-pin restore fallback. The root
        # `regula` package requires nothing; the Mathlib package in `audit/` pins every
        # dependency here and names the root `.lake/packages` as its packages directory.
        path: |
          .lake/packages
          ~/.cache/mathlib-packages
        key: lean-dependencies-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-plan.outputs.identity }}-${{ steps.dependency-plan.outputs.scope }}-${{ hashFiles('audit/lake-manifest.json', 'audit/lakefile.lean') }}

    # Run from the repository root: `cache get` unpacks Mathlib's dependencies' archives
    # relative to its working directory (`.lake/packages/<name>`), not the `audit/`
    # workspace's packages directory, so this lands them in the shared root one.
    - name: Provision or admit Mathlib artifacts
      if: inputs.dependencies == 'true' && (steps.dependencies.outputs.cache-hit != 'true' || steps.dependency-plan.outputs.mode == 'source')
      shell: bash
      run: lean --run lean/RegulaProvision.lean mathlib

    # Save provisioned dependencies before verification, even if it later fails.
    - name: Save pinned dependencies
      if: inputs.dependencies == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages
          ~/.cache/mathlib-packages
        key: ${{ steps.dependencies.outputs.cache-primary-key }}

    # The website package's own dependencies (Verso, SubVerso, MD4Lean, illuminate), pinned by
    # its lock manifest in the shared `.lake/packages`; its other entries are the Mathlib
    # package's.
    - name: Restore pinned Verso dependencies
      if: inputs.verso == 'true'
      id: verso
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
        key: verso-shared-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-plan.outputs.identity }}-${{ hashFiles('website/lake-manifest.json') }}

    - name: Provision pinned Verso
      if: inputs.verso == 'true'
      shell: bash
      run: lean --run lean/RegulaProvision.lean verso

    - name: Save pinned Verso dependencies
      if: inputs.verso == 'true' && steps.verso.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
        key: ${{ steps.verso.outputs.cache-primary-key }}
