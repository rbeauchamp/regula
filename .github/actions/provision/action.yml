name: Provision pinned Lean and dependencies
description: >-
  Restore or install the pinned Elan/Lean toolchain and required system tools, then, when
  asked, restore or provision pinned Lake dependency artifacts. Provisioning only: no policy,
  validation or test orchestration.

inputs:
  bootstrap-only:
    description: Install pinned Elan, stable Lean and system bootstrap tools only.
    required: false
    default: 'false'
  dependencies:
    description: >-
      Export the repository's dependency artifact policy for the job's Lake builds. A job that
      runs only toolchain scripts, such as the title check, turns it off. No dependency is
      acquired by this input alone: the root and `audit/` packages require none.
    required: false
    default: 'true'
  mathlib:
    description: >-
      Also restore or provision the pinned Mathlib of the Mathlib integration package in
      `integration/mathlib/`. Only the Mathlib integration job turns it on; no other job
      downloads, caches or builds Mathlib.
    required: false
    default: 'false'
  verso:
    description: >-
      Also restore or provision the website package's pinned Verso dependencies in the root
      `.lake/packages` (the standard's check and the site need them).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore pinned toolchain
      if: inputs.bootstrap-only != 'true' && hashFiles('.github/snapshot-compiler.json') == ''
      id: toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan/toolchains
          ~/.cache/regula-compilers
        key: lean-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', '.github/compiler-source.json', 'lean/RegulaCompiler.lean') }}

    - name: Install Elan and pinned Lean
      env:
        ELAN_TARGET: ${{ runner.os == 'Linux' && runner.arch == 'X64' && 'x86_64-unknown-linux-gnu' || runner.os == 'macOS' && runner.arch == 'ARM64' && 'aarch64-apple-darwin' || '' }}
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$ELAN_TARGET.tar.gz" \
          -o "$RUNNER_TEMP/elan.tar.gz"
        tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/elan-init" -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0

    - name: Install Linux bootstrap tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v timeout >/dev/null || ! command -v shellcheck >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes coreutils shellcheck
        fi

    - name: Install macOS bootstrap tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils shellcheck
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Check bootstrap tools
      shell: bash
      run: |
        timeout --version
        shellcheck --version

    - name: Install the declared compiler
      if: inputs.bootstrap-only != 'true'
      id: compiler
      shell: bash
      run: elan run leanprover/lean4:v4.34.0 lean --run lean/RegulaCompiler.lean setup

    - name: Save pinned toolchain
      if: inputs.bootstrap-only != 'true' && hashFiles('.github/snapshot-compiler.json') == '' && steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan/toolchains
          ~/.cache/regula-compilers
        key: ${{ steps.toolchain.outputs.cache-primary-key }}

    - name: Read dependency artifact identity
      if: inputs.bootstrap-only != 'true' && (inputs.dependencies == 'true' || inputs.mathlib == 'true' || inputs.verso == 'true')
      id: dependency-plan
      shell: bash
      run: lean --run lean/RegulaProvision.lean identity

    - name: Restore pinned Mathlib
      if: inputs.bootstrap-only != 'true' && inputs.mathlib == 'true' && steps.compiler.outputs.snapshot != 'true'
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Cache dependency checkouts and unpacked artifacts, never root builds
        # or duplicate Mathlib download archives. No cross-pin restore fallback. The Mathlib
        # integration package pins every dependency here and keeps its own packages directory.
        path: |
          integration/mathlib/.lake/packages
          ~/.cache/mathlib-packages
        key: lean-dependencies-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-plan.outputs.identity }}-${{ steps.dependency-plan.outputs.scope }}-${{ hashFiles('integration/mathlib/lake-manifest.json', 'integration/mathlib/lakefile.lean') }}

    # The plan runs `cache get` in the integration package, whose own `.lake/packages` is where
    # Mathlib's cache tool unpacks its dependencies' archives. A compiler snapshot holds no
    # Mathlib, so nothing is provisioned for one.
    - name: Provision or admit Mathlib artifacts
      if: inputs.bootstrap-only != 'true' && inputs.mathlib == 'true' && steps.compiler.outputs.snapshot != 'true' && (steps.dependencies.outputs.cache-hit != 'true' || steps.dependency-plan.outputs.mode == 'source')
      shell: bash
      run: lean --run lean/RegulaProvision.lean mathlib

    # Save provisioned dependencies before verification, even if it later fails.
    - name: Save pinned Mathlib
      if: inputs.bootstrap-only != 'true' && inputs.mathlib == 'true' && steps.compiler.outputs.snapshot != 'true' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          integration/mathlib/.lake/packages
          ~/.cache/mathlib-packages
        key: ${{ steps.dependencies.outputs.cache-primary-key }}

    # The website package's dependencies (Verso and its own: SubVerso, MD4Lean, illuminate, Cli,
    # plausible), pinned by its lock manifest in the root `.lake/packages`.
    - name: Restore pinned Verso dependencies
      if: inputs.bootstrap-only != 'true' && inputs.verso == 'true' && steps.compiler.outputs.snapshot != 'true'
      id: verso
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
          .lake/packages/Cli
          .lake/packages/plausible
        key: verso-shared-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-plan.outputs.identity }}-${{ hashFiles('website/lake-manifest.json') }}

    - name: Provision pinned Verso
      if: inputs.bootstrap-only != 'true' && inputs.verso == 'true'
      shell: bash
      run: lean --run lean/RegulaProvision.lean verso

    - name: Save pinned Verso dependencies
      if: inputs.bootstrap-only != 'true' && inputs.verso == 'true' && steps.compiler.outputs.snapshot != 'true' && steps.verso.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .lake/packages/verso
          .lake/packages/subverso
          .lake/packages/MD4Lean
          .lake/packages/illuminate
          .lake/packages/Cli
          .lake/packages/plausible
        key: ${{ steps.verso.outputs.cache-primary-key }}
