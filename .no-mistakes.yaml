# Configuration of the no-mistakes validation pipeline that every change to Regula passes through.
# no-mistakes reads every setting here only from the copy of this file on the default branch, so a
# change to it governs the runs that start after its merge.
#
# The gate of a change. The repository has no CI workflow. The pipeline's Test step is the gate: it
# runs `commands.test` in the run's disposable checkout at the commit it validates, and an exit code
# other than 0 parks it. The command is the local gate (`lean/Regula/DiagnosticsGate.lean`), which
# runs its steps one after another and stops at the first that fails. It starts by removing each
# earlier build output. No `build_outputs` is declared: for Lake, the only store it may seed is Lake's
# artifact cache, and the gate runs each command with `LAKE_ARTIFACT_CACHE=false`, so a seeded cache
# would go unread.
#
# `no_ci` declares that no workflow file reports a check on a pull request, so a pull request with no
# checks can count as ready. A check that GitHub still reports is processed as before.
#
# `pr.title_format` stays unset, so no-mistakes drafts each title as a Conventional Commits header.
#
# The description of a pull request becomes the body of its one commit on main, and it records the
# reasons for the change. `pr.template` names the template of that description,
# .github/pull_request_template.md: its top-level headings are the sections that each description
# carries. no-mistakes drafts a new description from the template and refuses a draft that changes,
# drops or reorders one of those headings. On each later run it keeps the text that an author wrote
# before and after its generated appendix and refreshes only that appendix. It reads the template from
# the same default-branch commit as this file. Such a description is not fitted to the publication
# budget as an ordinary one is: when the author's text, closing references and recorded evidence do
# not fit, the PR step fails instead of dropping any of them. So `pr.appendix: minimal` keeps the
# generated appendix to the Intent section, a one-line risk summary and the pipeline's signature and
# attestation.
#
# Memory. The gate's Lake builds run as many jobs as the machine has cores and its Lean processes run
# with no memory limit, so nothing bounds its peak, and no measurement of the present gate is recorded
# here. So the step takes the machine's whole heavy-work budget (16 GiB on the 24 GiB Mac that runs it,
# which keeps 8 GiB in reserve). Measure the gate before the bound is lowered.
#
# Tests are not evidence. Regula establishes the claims of a change by types, constructions,
# contracts, machine-checked proofs and derivation, not by tests. The pipeline's reviewer, test and
# fix agents learn that rule only from this file, so it declares `test.tests_as_evidence` with
# `policy: forbid`. With it, each agent of the pipeline that could write, ask for or review a test
# is told not to use a test as evidence, and missing evidence is reported as a missing proof,
# contract or derivation, or as an open claim. A change whose listing of tests prints an identifier
# that the listing of its base does not print is blocked at the Test step, at publication and on CI
# repairs.
#
# The listing is lean/Regula/TestListing.lean, whose module docstring states what it reads and
# what it trusts. Lake knows one kind of test, the package's test driver, which `lake test` runs.
# The listing prints the driver that Lake reports for the root package, and prints nothing when Lake
# reports none. It fails, and so blocks rather than passes, when Lake cannot load the package or the
# driver cannot be printed as one identifier. It reads the package with Lake's own loader and builds
# no target. The library name in the command is macOS's: on another system the command fails.
#
# Memory of the listing. Measured on 2026-10-27 on a checkout with no .lake directory: `lake env`
# peaked at 0.75 GB resident and the program at 1.9 GB resident, most of it Lean's and Lake's .olean
# files, which the system maps from disk; the largest footprint of either was 0.15 GB. The command
# runs through `no-mistakes admit` with a bound above the two together, so it waits until the bound
# fits the machine's memory budget beside all other admitted work. Inside work that is already
# admitted, such as the Test step that `heavy_steps` declares, `admit` runs it within that share
# instead. Nothing enforces the bound.
#
# Verdicts of the Test step. `test.no_surface: proceed` lets a `no-surface` verdict, which says that
# no claim of a change needed a run of the product, complete the step without asking anyone. The
# reference of no-mistakes describes `proceed` as a declaration that a repository has no running
# product to drive, and with it tells the Test agent so. That is not why it is set here: Regula's
# product is its checker. It is set because that question waited on a supervisor on changes of prose
# and of unused code, as on pull requests 510 and 511, where the proofs, the gate and reading settle
# each claim, and because it did not catch the case below: the park of pull request 508 was approved
# with an empty reason. `no-go` and `inconclusive` still park.
#
# `test.instructions` keeps the claims that do need the checker run, because the setting alone does
# not. The gate's own checker runs must pass, so they show only that Regula's own builds are
# admitted, and never a refusal on a real build. The proofs reach the closed input and the pure
# function that fills it from an environment, and what Lean and Lake report and the shell's effects
# are trusted (specification/README.md, "The trusted base").
# Pull request 508 changed that loader and reached `no-surface` with its refusal claims only read
# from the source. The instructions make such a claim a run against a disposable project, reported
# `pass` or `fail`, and no-mistakes rejects either result under a `no-surface` verdict. Prose steers
# the agent and enforces nothing: an agent can still misjudge whether a claim needs a run, and a
# mistaken `no-surface` then stops nobody. Both settings are read only from the default branch.
no_ci: true
commands:
  test: lean --run lean/Regula/DiagnosticsGate.lean local
heavy_steps:
  test:
    memory: 16GiB
    limit: none; the whole heavy-work budget, because nothing bounds the peak of the gate's builds
test:
  instructions: |
    Regula's product is its checker, `lake lint` on a project that sets `lintDriver := "regula/lint"`, so this repository does have a product to drive, whatever the note on `no-surface` says. The local gate has already run the checker on Regula's own build and on `specification/`. Those runs must pass, so they show only that those builds are admitted; they never show a report or a refusal on a build that violates a rule.
    Decide each claim by what it is about:
    1. Drive a claim about what the checker reports, refuses or admits on a real build, when the change alters code that runs between a finished build and the report and no theorem reaches that path. The proofs in specification/RegulaSpecification/Proofs/ are about the rule functions and the verdict over the closed input, and the pure function that fills the input from an environment (`Regula.Load.Facts.input`), under the hypotheses each states; what Lean and Lake report, the effects of `Regula.Load` and `Regula.Workspace`, and how the shell prints the result and sets the exit code are not among them. Read a theorem's statement before relying on it. For example, a change to the loader that claims a build with some construct is refused needs a drive.
    2. Do not drive a claim that a theorem the gate builds settles, such as a change to a rule's function alone that its `exact` theorem still covers; a claim about what a document says; or a claim that removed code was run by no program, which the gate's build settles. Such a claim is machine-checked or argued, and a change with only such claims is `no-surface`.
    To drive: make the project of the section "Use it" of README.md in a new directory of your own under this worktree's Git-ignored `tmp/`, creating `tmp/` if it is absent, with its `require regula` at this worktree by `path` as an absolute path, then run `lake update`, `lake build` and `lake lint`. Use `lake build --wfail` when the construct gives no warning. `lake lint` exits 0 for pass, 1 for fail and 2 for incomplete. Make one build with the construct the claim is about and one that differs only by leaving it out, and report the exit code and the printed subjects of both as `pass` or `fail`. Remove the project afterwards: it is a run of the product for this claim, not a test to keep.
    If such a claim cannot be driven, report it `open` with what you tried and return `inconclusive`, not `no-surface`.
  no_surface: proceed
  tests_as_evidence:
    policy: forbid
    list_command: no-mistakes admit --memory 3GiB --limit "none; measured peaks 0.75 GB and 1.9 GB resident" -- lake env lean --load-dynlib=libLake_shared.dylib --run lean/Regula/TestListing.lean
pr:
  template: .github/pull_request_template.md
  appendix: minimal
